<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pet Pantry – Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#9C4DD4"/>
<link rel="icon" href="icons/icon-192.png" type="image/png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Pet Pantry"/>
</head>
<body>
<main class="auth-wrap">
  <div class="auth-card">
    <a class="auth-back" href="index.html">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><path d="M9.6 3.4 5 8l4.6 4.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Back to home
    </a>
    <div class="auth-logo" aria-hidden="true">🐾</div>
    <h1>Pet <span style="color:var(--accent)">Pantry</span></h1>
    <p class="auth-sub">Track your pet's food & meals — all in one place.</p>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email <span class="req">*</span></label>
        <input id="loginEmail" type="email" class="form-control" placeholder="you@email.com"/>
      </div>
      <div class="form-group">
        <label for="loginPass">Password <span class="req">*</span></label>
        <input id="loginPass" type="password" class="form-control" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary btn-full" id="loginBtn" onclick="doLogin()">Sign In</button>
      <p class="auth-toggle">New here? <a href="#" onclick="toggleAuth()">Create an account</a></p>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none">
      <div class="form-group">
        <label for="regName">Name <span class="req">*</span></label>
        <input id="regName" type="text" class="form-control" placeholder="Your name"/>
      </div>
      <div class="form-group">
        <label for="regEmail">Email <span class="req">*</span></label>
        <input id="regEmail" type="email" class="form-control" placeholder="you@email.com"/>
      </div>
      <div class="form-group">
        <label for="regPass">Password <span class="req">*</span></label>
        <input id="regPass" type="password" class="form-control" placeholder="Create a password"/>
      </div>
      <button class="btn btn-primary btn-full" onclick="doRegister()">Create Account</button>
      <p class="auth-toggle">Already have an account? <a href="#" onclick="toggleAuth()">Sign In</a></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="pwa.js" defer></script>
<script>
(async () => {
  // Demo sessions exit via signOut() in app.js before ever reaching this
  // page; this is just a safety net for stray navigation (back/forward).
  if (isDemoMode()) exitDemoMode();
  await Auth.init();
  if (Auth.isLoggedIn()) window.location.href = 'inventory.html';
})();

function toggleAuth() {
  const l = document.getElementById('loginForm');
  const r = document.getElementById('registerForm');
  l.style.display = l.style.display === 'none' ? '' : 'none';
  r.style.display = r.style.display === 'none' ? '' : 'none';
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  if (!email || !pass) { toast('Please fill all fields', 'danger'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  const { error } = await Auth.login(email, pass);
  if (error) {
    toast(error, 'danger');
    btn.disabled = false;
    btn.textContent = 'Sign In';
    return;
  }
  window.location.href = 'inventory.html';
}

async function doRegister() {
  const name  = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass  = document.getElementById('regPass').value;
  if (!name || !email || !pass) { toast('Please fill all fields', 'danger'); return; }
  const { error, needsConfirm } = await Auth.register(name, email, pass);
  if (error) { toast(error, 'danger'); return; }
  if (needsConfirm) { toast('Check your email to confirm your account, then sign in.', 'success'); toggleAuth(); return; }
  window.location.href = 'inventory.html';
}
</script>
</body>
</html>
